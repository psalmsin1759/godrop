publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  go_router: ^13.2.0
  equatable: ^2.0.5
  cupertino_icons: ^1.0.6
  dio: ^5.4.3
  retrofit: '>=4.4.1 <4.9.0'
  flutter_secure_storage: ^9.2.2
  json_annotation: ^4.9.0
  shared_preferences: ^2.3.3
  image_picker: ^1.1.2
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: '>=2.4.9 <2.14.0'
  retrofit_generator: '>=9.1.4 <10.0.0'
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
