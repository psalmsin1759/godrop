name: godrop_vendor
description: GoDrop Vendor App — manage your Godrop store, orders, and payouts.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  go_router: ^13.2.0
  google_fonts: ^6.2.1
  equatable: ^2.0.5
  cupertino_icons: ^1.0.6
  dio: ^5.4.3
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0
  flutter_local_notifications: ^18.0.0
  retrofit: '>=4.4.1 <4.9.0'
  flutter_secure_storage: ^9.2.2
  json_annotation: ^4.9.0
  shared_preferences: ^2.3.3
  shimmer: ^3.0.0
  image_picker: ^1.1.2
  geolocator: ^13.0.0
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_native_splash: ^2.4.3
  flutter_launcher_icons: ^0.14.1
  build_runner: '>=2.4.9 <2.14.0'
  retrofit_generator: '>=9.1.4 <10.0.0'
  json_serializable: ^6.8.0

flutter_native_splash:
  color: "#1A3CCC"
  image: assets/images/logo.png
  color_dark: "#0D1F6E"
  image_dark: assets/images/logo.png
  android_12:
    image: assets/images/logo.png
    color: "#1A3CCC"
    color_dark: "#0D1F6E"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/launchicon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/launchicon.png
